name: Build Go CLI for All Platforms

on:
  push:
    tags:
      - 'go-build-v*'

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, windows, darwin]
        goarch: [amd64, arm64, 386]
        exclude:
          - goos: darwin
            goarch: 386
    name: Build ${{ matrix.goos }}-${{ matrix.goarch }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p dist
          EXT=""
          if [ "${GOOS}" = "windows" ]; then
            EXT=".exe"
          fi
          OUTPUT="dist/buzzlink-${GOOS}-${GOARCH}${EXT}"
          go build -o "$OUTPUT" .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: buzzlink-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/buzzlink-${{ matrix.goos }}-${{ matrix.goarch }}*
